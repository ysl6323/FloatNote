<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ed">
  <meta name="description" content="Floatnote is a quiet, bilingual task canvas. Notes drift toward their deadlines. A single HTML file, saved locally.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='20' height='22' rx='3' fill='%23c6d5d8'/%3E%3Crect x='11' y='2' width='18' height='23' rx='3' fill='%23e2c3b9'/%3E%3C/svg%3E">
  <title>浮笺 · Floatnote</title>
  <style>
:root {
  --ink: #394743;
  --muted: #77817a;
  --edge: #dcded5;
  --bg: #f4f3ed;
  --panel: #fcfbf7;
  --shadow: 0 14px 32px #3b4b4214, 0 2px 5px #3b4b4209;
  --accent: #748f81;
  --header-height: 124px;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button { cursor: pointer; color: inherit; border: 0; background: transparent; }
button:disabled { cursor: default; opacity: .43; }
button, input, select { outline: none; }
button:focus-visible, input:focus-visible, select:focus-visible, [contenteditable]:focus-visible { outline: 2px solid #77958a; outline-offset: 3px; }
svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
[hidden] { display: none !important; }
.icon-symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
.app { position: relative; height: 100%; isolation: isolate; }

/* A quiet, compact workspace header. */
.topbar { height: var(--header-height); position: absolute; inset: 0 0 auto; z-index: 30; display: grid; grid-template-columns: minmax(180px, 1fr) minmax(190px, auto) minmax(250px, 1fr); align-items: center; gap: 22px; padding: 0 34px; border-bottom: 1px solid #deded4; background: #f4f3edf2; backdrop-filter: blur(18px); }
.brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
.brand > div:last-child { min-width: 0; }
.brand-icon { width: 36px; height: 40px; position: relative; flex-shrink: 0; }
.brand-icon:before, .brand-icon:after { content: ""; position: absolute; width: 25px; height: 29px; border: 1px solid #fff9; border-radius: 3px 7px 3px 3px; box-shadow: 0 3px 7px #44545a12; }
.brand-icon:before { left: 0; top: 8px; background: #c6d5d8; transform: rotate(-12deg); }
.brand-icon:after { left: 10px; top: 2px; background: #e2c3b9; transform: rotate(8deg); }
h1 { font-size: 29px; letter-spacing: .025em; margin: 0; font-weight: 600; line-height: 1.2; }
html[lang^="zh"] h1 { letter-spacing: .1em; }
.brand-sub { font-size: 12px; letter-spacing: .15em; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.brand-philosophy { font-size: 13px; font-weight: 400; color: #737e76; line-height: 1.55; margin: 6px 0 0; max-width: 280px; text-wrap: pretty; }
.top-center { justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; color: var(--muted); }
.clock-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
.clock-label { font-size: 13px; color: #707d71; letter-spacing: .01em; }
.clock-time { font-size: 34px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .035em; color: #4e6559; line-height: 1.1; white-space: nowrap; }
.clock-date { display: flex; align-items: center; justify-content: center; gap: 7px; color: #7c8578; font-size: 13px; line-height: 1.5; white-space: nowrap; }
.status-dot { width: 5px; height: 5px; background: #91a38d; border-radius: 50%; flex-shrink: 0; }
.timezone-trigger { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; color: #697c6e; padding: 5px 7px; border-radius: 6px; border: 1px solid transparent; white-space: nowrap; }
.timezone-trigger:hover, .timezone-trigger[aria-expanded="true"] { background: #e8ece3; border-color: #d9e0d3; }
.timezone-trigger svg { width: 12px; height: 12px; }
.toolbar { justify-self: end; display: flex; gap: 7px; align-items: center; min-width: 0; }
.tool-btn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; color: #6f7b72; flex-shrink: 0; transition: background .15s, color .15s; }
.tool-btn:hover { background: #e6e9e0; color: #405b4c; }
.language-switch { display: inline-flex; align-items: center; padding: 3px; border: 1px solid #dce0d4; border-radius: 9px; background: #eaece4; flex-shrink: 0; }
.language-switch button { min-width: 39px; height: 31px; padding: 0 7px; color: #798375; font-size: 13px; font-weight: 500; border-radius: 6px; white-space: nowrap; transition: background .15s, color .15s, box-shadow .15s; }
.language-switch button:hover { color: #405c4c; }
.language-switch button.active { background: #fbfcf7; color: #425e4b; box-shadow: 0 1px 4px #40523c12; }
.add-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 9px 13px; border: 1px solid #cbd7c8; border-radius: 9px; background: #e2e9dd; color: #425c43; font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; transition: background .15s, box-shadow .15s; }
.add-btn:hover { background: #d7e2d0; box-shadow: 0 3px 10px #687b5010; }
.add-btn svg { width: 15px; height: 15px; }

.board { position: absolute; inset: var(--header-height) 0 0; z-index: 1; overflow: hidden; touch-action: none; isolation: isolate; background-image: radial-gradient(#929e8c22 .75px, transparent .75px), radial-gradient(ellipse at 50% 0%, #e5bcb722, transparent 54%), radial-gradient(ellipse at 50% 100%, #b9d1d72e, transparent 60%); background-size: 24px 24px, 100% 100%, 100% 100%; }
.finish { position: absolute; top: 0; left: 44px; right: 44px; height: 44px; pointer-events: none; color: #8a7d73; z-index: 0; }
.finish:after { content: ""; position: absolute; left: 0; right: 0; top: 42px; border-top: 1px dashed #bca39980; }
.finish-label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 15px; line-height: 1.5; }
.finish-label i { display: block; width: 5px; height: 5px; border-radius: 50%; background: #bd9c92; }
.finish-caption { position: absolute; right: 0; top: 15px; font-size: 13px; line-height: 1.5; color: #8e847b; }
.priority-axis { position: absolute; left: 16px; top: 98px; bottom: 105px; width: 18px; display: flex; flex-direction: column; align-items: center; gap: 13px; pointer-events: none; color: #7e8a7a; font-size: 12px; line-height: 1.3; z-index: 0; }
.axis-line { flex: 1; width: 2px; min-height: 25px; border-radius: 10px; background: linear-gradient(#d7b0a9b3, #d6d7bcb3, #aec8d3b3); }
.priority-axis .axis-low { writing-mode: vertical-rl; }
.empty { position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; transition: opacity .2s; width: min(400px, calc(100% - 54px)); }
.empty.hidden { opacity: 0; }
.empty-illustration { height: 95px; width: 122px; margin: 0 auto 24px; position: relative; }
.empty-sheet { width: 64px; height: 77px; position: absolute; top: 10px; left: 26px; border: 1px solid #dce3d9; box-shadow: 0 9px 15px #454f4510; border-radius: 5px 12px 5px 5px; background: #e4ebe5; transform: rotate(-14deg); }
.empty-sheet.two { background: #ece2d8; transform: rotate(12deg); left: 45px; top: 3px; border-color: #fff9; }
.empty-sheet.two:before, .empty-sheet.two:after { content: ""; position: absolute; left: 13px; top: 26px; width: 34px; height: 1px; background: #aaa99573; }
.empty-sheet.two:after { top: 35px; width: 24px; }
.empty-title { font-size: 22px; font-weight: 500; letter-spacing: .01em; color: #5f7364; line-height: 1.5; }
.empty-desc { font-size: 15px; color: #7b897c; margin: 10px 0 0; line-height: 1.8; }
.empty-tip { margin-top: 20px; font-size: 13px; color: #8a9586; line-height: 1.6; }

/* The paper stays light; metadata remains legible. */
.note { position: absolute; width: 308px; min-height: 204px; padding: 17px 19px 14px; background: var(--note-color, #d0dfe7); border: 1px solid #ffffffa3; border-radius: 7px 16px 7px 7px; box-shadow: var(--shadow); cursor: grab; user-select: none; touch-action: none; transition: box-shadow .2s, transform .2s; transform-origin: 50% 70%; }
.note:before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(145deg, #ffffff29, #ffffff00 75%); }
.note:after { content: ""; position: absolute; right: 0; top: 0; width: 17px; height: 17px; background: linear-gradient(45deg, #ffffff08 50%, #fff7 51%); border-radius: 0 15px 0 5px; pointer-events: none; }
.note:hover { box-shadow: 0 18px 36px #3c484921, 0 3px 8px #3c484911; }
.note.dragging { transform: rotate(-1deg) scale(1.018); box-shadow: 0 25px 44px #3c484927, 0 4px 12px #3c484913; cursor: grabbing; z-index: 900 !important; }
.note.arrived { border-color: #b57e7266; }
.note.new { animation: appear .24s ease-out; }
@keyframes appear { from { opacity: 0; transform: scale(.96) translateY(7px); } to { opacity: 1; transform: none; } }
.note-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; color: #596b60; min-height: 25px; }
.created { font-size: 13px; letter-spacing: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ddl-btn { display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 5px 6px; border-radius: 6px; color: #5d6c62; max-width: 148px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ddl-btn span { overflow: hidden; text-overflow: ellipsis; }
.ddl-btn svg { width: 12px; height: 12px; }
.ddl-btn:hover, .ddl-btn.active { background: #ffffff48; color: #354b3e; }
.ddl-btn.has-ddl { color: #4f6656; }
.note.arrived .ddl-btn { color: #85594e; }
.note-title { position: relative; margin-top: 15px; min-height: 72px; max-height: 180px; overflow: auto; font-size: 21px; font-weight: 550; line-height: 1.6; letter-spacing: .005em; user-select: text; cursor: text; white-space: pre-wrap; overflow-wrap: anywhere; outline: none !important; color: #35463d; }
.note-title:empty:before { content: attr(data-placeholder); color: #687a6a; pointer-events: none; font-weight: 400; }
.note-title:focus { border-radius: 3px; background: #ffffff1c; }
.note-footer { display: flex; justify-content: space-between; align-items: center; gap: 5px; margin-top: 9px; position: relative; min-height: 25px; }
.motion-label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #596d5d; line-height: 1.4; }
.motion-label .dot { width: 4px; height: 4px; border-radius: 50%; background: #718579; flex-shrink: 0; }
.note.arrived .motion-label { color: #815c50; }
.note-actions { display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
.note-action { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: #526e59; opacity: .75; transition: background .15s, opacity .15s; }
.note:hover .note-action, .note:focus-within .note-action { opacity: 1; }
.note-action:hover { background: #ffffff54; color: #34523c; }
.note-action svg { width: 16px; height: 16px; }
.note-grip { height: 10px; width: 10px; opacity: .25; position: absolute; bottom: 12px; left: calc(50% - 5px); background: radial-gradient(#4b6659 1px, transparent 1px); background-size: 4px 4px; pointer-events: none; }

.bottom-bar { position: absolute; bottom: 25px; left: 44px; z-index: 20; display: flex; gap: 19px; align-items: center; font-size: 13px; line-height: 1.5; color: #788575; pointer-events: none; }
.save-state { display: flex; align-items: center; gap: 6px; }
.save-state svg { width: 12px; height: 12px; }
.board-count { color: #5c745d; white-space: nowrap; }
.count-number { font-size: 15px; font-weight: 600; margin-right: 5px; font-variant-numeric: tabular-nums; }
.bottom-tip { color: #86907e; }
.archive { position: absolute; right: 28px; bottom: 22px; z-index: 40; width: 314px; background: #fafbf5ed; border: 1px solid #d9dfd1; border-radius: 12px; box-shadow: 0 7px 24px #4852440e; backdrop-filter: blur(20px); overflow: hidden; }
.archive-toggle { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 9px; padding: 0 16px; font-size: 14px; text-align: left; }
.archive-toggle:hover { background: #edf0e770; }
.archive-toggle > svg { color: #7a8d73; width: 15px; height: 15px; }
.archive-name { flex: 1; font-weight: 500; color: #566d50; }
.archive-badge { padding: 3px 8px; border-radius: 6px; background: #e9eee2; color: #718267; font-size: 13px; line-height: 1.4; font-variant-numeric: tabular-nums; }
.archive-chevron { transition: transform .2s; }
.archive.open .archive-chevron { transform: rotate(180deg); }
.archive-body { border-top: 1px solid #e0e5d7; padding: 8px; max-height: min(370px, 52vh); overflow: auto; }
.archive-empty { padding: 25px 13px 28px; text-align: center; color: #7e8c73; font-size: 13px; line-height: 1.8; }
.archive-empty svg { display: block; margin: 0 auto 10px; width: 24px; height: 24px; color: #a8b698; }
.archive-item { display: flex; gap: 9px; align-items: center; padding: 11px 8px; border-radius: 8px; }
.archive-item + .archive-item { border-top: 1px solid #e1e5d977; }
.archive-item:hover { background: #eaf0e16e; }
.archive-swatch { width: 4px; height: 30px; border-radius: 3px; flex-shrink: 0; }
.archive-copy { min-width: 0; flex: 1; }
.archive-title { font-size: 14px; line-height: 1.5; color: #5f7456; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.archive-time { font-size: 13px; color: #86957b; margin-top: 4px; }
.archive-actions { display: flex; gap: 2px; }
.archive-action { width: 30px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: #80936f; }
.archive-action svg { width: 13px; height: 13px; }
.archive-action:hover { background: #dce7d057; color: #526f3e; }

.popup { position: fixed; z-index: 1000; background: #fcfbf7; border: 1px solid #dce0d3; border-radius: 12px; box-shadow: 0 16px 46px #3b4b3b24, 0 2px 7px #3b4b3b0b; animation: popup-in .13s ease-out; }
@keyframes popup-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.menu { width: 224px; padding: 6px; }
.menu-caption { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: #849176; padding: 9px 10px 6px; }
.menu-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 10px; border-radius: 7px; font-size: 14px; color: #5f7353; line-height: 1.5; }
.menu-item svg { width: 14px; height: 14px; }
.menu-item:hover { background: #e7eddf91; }
.menu-item.primary { color: #466943; }
.menu-item.danger { color: #9b7668; }
.menu-item.danger:hover { background: #f0e2da91; }
.menu-divider { height: 1px; background: #e4e8db; margin: 5px; }
.deadline-popup { width: 348px; max-width: calc(100vw - 24px); padding: 19px; }
.popup-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 16px; font-weight: 550; color: #4e6947; line-height: 1.5; }
.popup-heading button { color: #8a997d; display: grid; place-items: center; padding: 3px; border-radius: 5px; }
.popup-heading button:hover { background: #e9edde; color: #60764d; }
.popup-heading svg { width: 14px; height: 14px; }
.deadline-input { width: 100%; min-height: 43px; background: #f2f5ec; border: 1px solid #d4dec9; border-radius: 7px; padding: 9px; color: #4d6843; font-size: 14px; color-scheme: light; }
.quick-times { display: flex; gap: 5px; margin: 9px 0 13px; }
.quick-times button { flex: 1; font-size: 13px; line-height: 1.4; padding: 7px 3px; border-radius: 6px; background: #edf2e5; color: #768b60; }
.quick-times button:hover { background: #e0ebd2; color: #5e7649; }
.deadline-explainer { font-size: 13px; line-height: 1.8; color: #7d8c6d; margin: 0 0 15px; }
.deadline-zone { font-size: 13px; line-height: 1.5; color: #778a65; margin: 0 0 8px; }
.deadline-error { font-size: 13px; line-height: 1.6; color: #a26352; margin: 9px 0 0; }
.deadline-footer { display: flex; justify-content: space-between; gap: 15px; align-items: center; }
.clear-ddl { color: #957665; font-size: 13px; padding: 6px 0; }
.clear-ddl:hover { color: #805944; }
.confirm-btn { background: #78906e; color: #fff; padding: 9px 14px; border-radius: 7px; font-size: 14px; white-space: nowrap; }
.confirm-btn:hover { background: #687f5e; }
.ambiguity-control { display: flex; flex-direction: column; gap: 7px; margin: 12px 0; padding: 10px; border: 1px solid #d8dfcc; border-radius: 7px; background: #f0f4e8; }
.ambiguity-control label { font-size: 13px; color: #6f845b; line-height: 1.6; }
.ambiguity-control select { width: 100%; min-height: 34px; padding: 6px; font-size: 13px; border: 1px solid #d1dbc3; border-radius: 5px; background: #fafcf5; color: #587147; }
.timezone-popup { width: 368px; max-width: calc(100vw - 24px); padding: 20px; }
.timezone-popup select { width: 100%; min-height: 43px; padding: 9px 10px; border: 1px solid #d2dcc6; border-radius: 7px; background: #f2f5eb; color: #4f6747; font-size: 14px; }
.timezone-popup label { display: block; margin: 0 0 8px; font-size: 13px; color: #738766; line-height: 1.5; }
.zone-current { margin-top: 12px; padding: 11px 12px; border-radius: 7px; background: #edf2e4; color: #5e764c; font-size: 14px; line-height: 1.8; font-variant-numeric: tabular-nums; }
.zone-current strong, .zone-current time { font-weight: 500; }
.settings-note { margin: 11px 0 0; color: #7a8a6c; font-size: 13px; line-height: 1.75; }
.timezone-popup footer, .timezone-popup .timezone-footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 17px; padding-top: 13px; border-top: 1px solid #e1e7d6; }

.overlay { position: fixed; inset: 0; background: #39453632; backdrop-filter: blur(5px); z-index: 2000; display: grid; place-items: center; padding: 20px; }
.help { width: min(500px, 100%); max-height: calc(100dvh - 40px); overflow: auto; background: #fbfcf5; border: 1px solid #fff9; border-radius: 17px; box-shadow: 0 30px 90px #34432d30; padding: 28px; }
.help-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.help h2 { font-size: 25px; font-weight: 500; margin: 0; color: #4c6941; line-height: 1.4; }
.help-sub { font-size: 14px; color: #7c906b; margin: 9px 0 25px; line-height: 1.7; }
.help-row { display: flex; gap: 14px; align-items: flex-start; margin: 16px 0; font-size: 14px; color: #718860; line-height: 1.8; }
.help-row svg { width: 17px; height: 17px; margin-top: 3px; color: #8ca477; }
.help-row strong { font-weight: 500; color: #506f40; }
.help-footer { border-top: 1px solid #dfe8d2; margin-top: 24px; padding-top: 16px; font-size: 13px; color: #80946e; line-height: 1.9; }
.toast { position: fixed; bottom: 31px; left: 50%; z-index: 3000; transform: translate(-50%, 10px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; background: #52684beF; color: #f8fbf4; padding: 11px 17px; border-radius: 9px; font-size: 14px; line-height: 1.6; box-shadow: 0 5px 25px #394b3320; max-width: calc(100vw - 40px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1100px) {
  .topbar { grid-template-columns: minmax(175px, 1fr) auto auto; gap: 17px; padding: 0 25px; }
  .brand { gap: 10px; }
  .brand-philosophy { max-width: 220px; }
  .clock-time { font-size: 31px; }
  .clock-row { gap: 6px; }
  .toolbar { gap: 4px; }
  .bottom-tip { display: none; }
}
@media (max-width: 900px) {
  .topbar { gap: 12px; padding: 0 20px; grid-template-columns: minmax(154px, 1fr) auto auto; }
  .brand-icon { width: 30px; transform: scale(.86); transform-origin: left center; margin-right: -3px; }
  .brand-philosophy { max-width: 190px; font-size: 12px; }
  .brand-sub { font-size: 12px; letter-spacing: .08em; }
  .clock-row { flex-direction: column; gap: 1px; }
  .clock-time { font-size: 29px; }
  .clock-date { font-size: 12px; }
  .timezone-trigger { padding: 3px 5px; }
  .add-btn { padding: 8px 10px; font-size: 13px; }
  .tool-btn { width: 31px; height: 33px; }
}
@media (max-width: 760px) {
  :root { --header-height: 166px; }
  .topbar { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 9px 14px; padding: 14px 23px 12px; }
  .brand { grid-column: 1; grid-row: 1; }
  .brand-icon { width: 31px; }
  h1 { font-size: 28px; }
  .brand-sub { display: none; }
  .brand-philosophy { max-width: 260px; font-size: 13px; margin-top: 4px; line-height: 1.4; }
  .toolbar { grid-column: 2; grid-row: 1; gap: 4px; }
  .top-center { grid-column: 1 / -1; grid-row: 2; flex-direction: row; gap: 12px; justify-self: center; }
  .clock-row { flex-direction: row; gap: 8px; }
  .clock-time { font-size: 28px; }
  .clock-date { font-size: 13px; }
  .timezone-trigger { font-size: 13px; }
  .finish { left: 30px; right: 30px; }
  .finish-caption { display: none; }

      empty.innerHTML = icon('archive') + '<div></div><p></p>'; empty.querySelector('div').textContent = t('archiveEmpty'); empty.querySelector('p').textContent = t('archiveEmptyHint'); panel.appendChild(empty); return;
    }
    [...state.archive].reverse().forEach(todo => {
      const item = document.createElement('div'); item.className = 'archive-item';
      item.innerHTML = '<div class="archive-swatch"></div><div class="archive-copy"><div class="archive-title"></div><div class="archive-time"></div></div><div class="archive-actions"><button class="archive-action restore-btn">' + icon('restore') + '</button><button class="archive-action remove-btn">' + icon('delete') + '</button></div>';
      item.querySelector('.archive-swatch').style.background = todo.completedColor || colorFor(todo.y);
      item.querySelector('.archive-title').textContent = todo.title || t('untitled'); item.querySelector('.archive-title').title = todo.title || t('untitled');
      item.querySelector('.archive-time').textContent = t('completedAt', { date: deadlineTime(todo.completedAt || todo.createdAt) });
      for (const [selector, key] of [['.restore-btn', 'restore'], ['.remove-btn', 'deleteForever']]) { const button = item.querySelector(selector); button.title = t(key); button.setAttribute('aria-label', t(key)); }
      item.querySelector('.restore-btn').addEventListener('click', () => restore(todo.id));
      item.querySelector('.remove-btn').addEventListener('click', () => { state.archive = state.archive.filter(item => item.id !== todo.id); renderArchive(); updateCounts(); save(); showToast(t('toastDeleteArchived')); });
      panel.appendChild(item);
    });
  }
  function closePopups() {
    for (const popup of [menu, deadlinePopup, backupMenu, timezonePopup]) popup.hidden = true;
    cards.forEach(card => card.querySelector('.ddl-btn').classList.remove('active'));
    selectedId = null; deadlineId = null;
    $('#timezoneBtn').setAttribute('aria-expanded', 'false');
  }
  function positionPopup(popup, x, y) {
    popup.style.left = clamp(x, 10, Math.max(10, window.innerWidth - popup.offsetWidth - 10)) + 'px';
    popup.style.top = clamp(y, 10, Math.max(10, window.innerHeight - popup.offsetHeight - 10)) + 'px';
  }
  function openMenu(id, x, y) { closePopups(); selectedId = id; menu.hidden = false; positionPopup(menu, x, y); menu.querySelector('button').focus({ preventScroll: true }); }

  function applyLocale() {
    document.documentElement.lang = prefs.language === 'zh' ? 'zh-CN' : 'en';
    document.title = prefs.language === 'zh' ? '浮笺 · Floatnote' : 'Floatnote · A canvas for your days';
    document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = t(element.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(element => { element.innerHTML = t(element.dataset.i18nHtml); });
    for (const attr of ['title', 'aria-label']) document.querySelectorAll('[data-i18n-' + attr + ']').forEach(element => element.setAttribute(attr, t(element.getAttribute('data-i18n-' + attr))));
    document.querySelectorAll('[data-language]').forEach(button => { const active = button.dataset.language === prefs.language; button.classList.toggle('active', active); button.setAttribute('aria-pressed', String(active)); });
    $('#saveText').textContent = t(storageFailed ? 'saveFailed' : 'localSave');
    state.todos.forEach(todo => updateCardLabels(todo, cards.get(todo.id)));
    updateCounts(); renderArchive(); lastClockSecond = -1; updateClock(Date.now());
  }
  function updateClock(time) {
    const second = Math.floor(time / 1000); if (second === lastClockSecond) return;
    lastClockSecond = second;
    const clock = $('#clockTime'); clock.textContent = format(time, { hour: '2-digit', minute: '2-digit', second: '2-digit' }); clock.dateTime = new Date(time).toISOString();
    $('#todayLabel').textContent = format(time, { month: 'short', day: 'numeric', weekday: 'short' });
    $('#clockZoneName').textContent = zoneName(zone()); $('#clockZoneOffset').textContent = offsetLabel(time, zone());
  }
  function openTimezone() {
    const wasOpen = !timezonePopup.hidden; closePopups(); if (wasOpen) return;
    const select = $('#timezoneSelect'); select.replaceChildren();
    const deviceZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const choices = [...ZONES];
    for (const value of [deviceZone, zone()]) if (!choices.some(item => item[0] === value)) choices.push([value, value, value]);
    for (const choice of choices) {
      const option = document.createElement('option'); option.value = choice[0];
      option.textContent = zoneName(choice[0]) + ' · ' + offsetLabel(Date.now(), choice[0]) + (choice[0] === deviceZone ? ' · ' + t('systemZone') : ''); select.appendChild(option);
    }
    select.value = zone(); timezonePopup.hidden = false; $('#timezoneBtn').setAttribute('aria-expanded', 'true');
    const rect = $('#timezoneBtn').getBoundingClientRect(); positionPopup(timezonePopup, rect.left - 60, rect.bottom + 12); select.focus({ preventScroll: true });
  }
  function setZone(value) {
    prefs.zones[prefs.language] = value; closePopups(); savePreferences(); applyLocale(); showToast(t('toastZone', { zone: zoneName(value) }));
  }

  // datetime-local has no zone. Resolve its wall time explicitly, including DST.
  function validateDeadline() {
    const input = $('#deadlineInput'), error = $('#deadlineError'), ambiguity = $('#ambiguityControl');
    ambiguity.hidden = true; error.hidden = true; deadlineCandidates = [];
    $('#deadlineZone').textContent = t('zoneContextPlain', { zone: zoneName(zone()) });
    $('#confirmDeadline').disabled = true;
    if (!input.value) return;
    try { deadlineCandidates = possibleInstants(input.value, zone()); }
    catch { error.textContent = t('invalidDate'); error.hidden = false; return; }
    if (!deadlineCandidates.length) { error.textContent = t('missingTime'); error.hidden = false; return; }
    if (deadlineCandidates.length > 1) {
      ambiguity.hidden = false;
      const select = $('#ambiguitySelect'), previous = Number(select.value); select.replaceChildren();
      deadlineCandidates.forEach((instant, index) => {
        const option = document.createElement('option'); option.value = String(instant);
        option.textContent = t(index === 0 ? 'firstOccurrence' : 'secondOccurrence', { offset: offsetLabel(instant, zone()) }); select.appendChild(option);
      });
      const preferred = deadlineCandidates.includes(preferredInstant) ? preferredInstant : deadlineCandidates.includes(previous) ? previous : deadlineCandidates[0];
      select.value = String(preferred);
    }
    $('#confirmDeadline').disabled = false;
    const shownInstant = deadlineCandidates.length > 1 ? Number($('#ambiguitySelect').value) : deadlineCandidates[0];
    $('#deadlineZone').textContent = t('zoneContext', { zone: zoneName(zone()), offset: offsetLabel(shownInstant, zone()) });
  }
  function openDeadline(id, anchor) {
    closePopups(); const todo = getTodo(id); if (!todo) return;
    deadlineId = id; preferredInstant = todo.deadline;
    $('#deadlineInput').value = zonedInput(todo.deadline || Math.ceil((Date.now() + 3600000) / 60000) * 60000, zone());
    $('#deadlineZone').textContent = t('zoneContext', { zone: zoneName(zone()), offset: offsetLabel(todo.deadline || Date.now(), zone()) });
    $('#clearDeadline').disabled = !todo.deadline; deadlinePopup.hidden = false; validateDeadline();
    anchor.classList.add('active'); const rect = anchor.getBoundingClientRect(); positionPopup(deadlinePopup, rect.right - deadlinePopup.offsetWidth, rect.bottom + 8);
    $('#deadlineInput').focus({ preventScroll: true });
  }
  function setDeadline(id, value) {
    const todo = getTodo(id); if (!todo) return;
    todo.y = effectiveY(todo); todo.deadline = value; todo.flowFrom = todo.y; todo.flowStart = Date.now();
    const card = cards.get(id); if (card) { updatePosition(todo, card); updateStatus(todo, card); }
    closePopups(); save(); showToast(t(value ? value <= Date.now() ? 'toastDueExpired' : 'toastDue' : 'toastNoDue'));
  }
  function quickDeadline(mode) {
    const stamp = Date.now(); let input;
    if (mode === 'hour') {
      preferredInstant = Math.ceil((stamp + 3600000) / 60000) * 60000; input = zonedInput(preferredInstant, zone());
    } else if (mode === 'tonight') {
      preferredInstant = null; input = zonedInput(stamp, zone()).slice(0, 10) + 'T23:59';
    } else {
      // Add a calendar day in the chosen zone, so DST preserves the clock time.
      preferredInstant = null;
      const parts = zonedParts(stamp, zone()), calendar = new Date(wallEpoch(parts));
      calendar.setUTCDate(calendar.getUTCDate() + 1); input = zonedInput(calendar.getTime(), 'UTC');
    }
    $('#deadlineInput').value = input; validateDeadline();
  }
  menu.addEventListener('click', event => {
    const action = event.target.closest('[data-action]')?.dataset.action, id = selectedId;
    if (!action || !id) return;
    if (action === 'complete') complete(id);
    if (action === 'delete') removeTodo(id);
    if (action === 'edit') { closePopups(); const card = cards.get(id); if (card) focusTitle(card); }
    if (action === 'deadline') { const card = cards.get(id); if (card) openDeadline(id, card.querySelector('.ddl-btn')); }
  });
  $('#deadlineInput').addEventListener('input', () => { preferredInstant = null; validateDeadline(); });
  $('#ambiguitySelect').addEventListener('change', () => { preferredInstant = Number($('#ambiguitySelect').value); validateDeadline(); });
  deadlinePopup.addEventListener('submit', event => {
    event.preventDefault(); validateDeadline(); if (!deadlineCandidates.length) return;
    const instant = deadlineCandidates.length > 1 ? Number($('#ambiguitySelect').value) : deadlineCandidates[0];
    if (validStamp(instant)) setDeadline(deadlineId, instant);
  });
  $('#closeDeadline').addEventListener('click', closePopups);
  $('#clearDeadline').addEventListener('click', () => setDeadline(deadlineId, null));
  deadlinePopup.querySelectorAll('[data-time]').forEach(button => button.addEventListener('click', () => quickDeadline(button.dataset.time)));
  timezonePopup.addEventListener('submit', event => { event.preventDefault(); setZone($('#timezoneSelect').value); });
  $('#timezoneBtn').addEventListener('click', openTimezone);
  $('#closeTimezone').addEventListener('click', closePopups);
  $('#resetTimezone').addEventListener('click', () => { $('#timezoneSelect').value = DEFAULT_ZONES[prefs.language]; });
  document.querySelectorAll('[data-language]').forEach(button => button.addEventListener('click', () => {
    if (prefs.language === button.dataset.language) return;
    document.activeElement?.blur(); finishDrag(); closePopups(); prefs.language = button.dataset.language;
    savePreferences(); applyLocale();
  }));
  board.addEventListener('dblclick', event => { if (!event.target.closest('.note')) create(event.clientX, event.clientY); });
  document.addEventListener('pointermove', moveDrag);
  document.addEventListener('pointerup', event => { if (drag?.pointerId === event.pointerId) finishDrag(); });
  document.addEventListener('pointercancel', event => { if (drag?.pointerId === event.pointerId) finishDrag(); });
  window.addEventListener('blur', finishDrag);
  $('#addBtn').addEventListener('click', () => create());
  $('#archiveToggle').addEventListener('click', () => { state.archiveOpen = !state.archiveOpen; renderArchive(); save(); });
  document.addEventListener('pointerdown', event => { if (!event.target.closest('.popup,.ddl-btn,.more-btn,#backupBtn,#timezoneBtn')) closePopups(); });
  window.addEventListener('resize', () => { closePopups(); state.todos.forEach(todo => updatePosition(todo, cards.get(todo.id))); });
  const helpOverlay = $('#helpOverlay');
  function closeHelp() { helpOverlay.hidden = true; $('#helpBtn').focus(); }
  $('#helpBtn').addEventListener('click', () => { closePopups(); helpOverlay.hidden = false; $('#closeHelp').focus(); });
  $('#closeHelp').addEventListener('click', closeHelp);
  helpOverlay.addEventListener('click', event => { if (event.target === helpOverlay) closeHelp(); });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') { if (!helpOverlay.hidden) closeHelp(); else closePopups(); }
    if (event.key === 'Tab' && !helpOverlay.hidden) { event.preventDefault(); $('#closeHelp').focus(); }
    if (!menu.hidden && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
      event.preventDefault(); const buttons = [...menu.querySelectorAll('button')]; let index = buttons.indexOf(document.activeElement);
      index = event.key === 'Home' ? 0 : event.key === 'End' ? buttons.length - 1 : (index + (event.key === 'ArrowDown' ? 1 : -1) + buttons.length) % buttons.length; buttons[index].focus();
    }
  });
  $('#backupBtn').addEventListener('click', () => {
    const wasOpen = !backupMenu.hidden; closePopups(); if (!wasOpen) { backupMenu.hidden = false; const rect = $('#backupBtn').getBoundingClientRect(); positionPopup(backupMenu, rect.right - backupMenu.offsetWidth, rect.bottom + 9); }
  });
  $('#exportBtn').addEventListener('click', () => {
    finishDrag(); document.activeElement?.blur(); saveNow();
    const data = JSON.stringify({ format: 'flowboard-backup', application: 'Floatnote', version: VERSION, exportedAt: Date.now(), ...state }, null, 2);
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json;charset=utf-8' })), link = document.createElement('a');
    link.href = url; link.download = 'Floatnote-backup-' + zonedInput(Date.now(), zone()).slice(0, 10) + '.json';
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    closePopups(); showToast(t('toastExport'));
  });
  $('#importBtn').addEventListener('click', () => { closePopups(); $('#importFile').click(); });
  $('#importFile').addEventListener('change', async event => {
    const file = event.target.files?.[0]; if (!file) return;
    try {
      if (file.size > 10000000) throw new Error('oversized-backup');
      const data = JSON.parse(await file.text());
      if (data.format !== 'flowboard-backup' || !Array.isArray(data.todos) || !Array.isArray(data.archive)) throw new Error('invalid-backup');
      const ids = new Set([...state.todos, ...state.archive].map(todo => todo.id)); let added = 0;
      for (const name of ['todos', 'archive']) for (const raw of data[name]) { const todo = sanitizeTodo(raw); if (todo && !ids.has(todo.id)) { state[name].push(todo); ids.add(todo.id); added++; } }
      renderAll(); save(); showToast(t(added ? 'toastImport' : 'toastAlreadyImported', { n: added }));
    } catch { showToast(t('toastInvalidBackup')); }
    finally { event.target.value = ''; }
  });
  window.addEventListener('pagehide', () => { finishDrag(); saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { finishDrag(); saveNow(); } });
  function frame() {
    const time = Date.now(), second = Math.floor(time / 1000), statusDue = second !== lastStatusSecond;
    updateClock(time);
    state.todos.forEach(todo => { const card = cards.get(todo.id); if (card) { if (todo.deadline || drag?.id === todo.id) updatePosition(todo, card, time); if (statusDue) updateStatus(todo, card, time); } });
    if (statusDue) lastStatusSecond = second;
    requestAnimationFrame(frame);
  }
  loadPreferences(); load(); renderAll(); applyLocale(); requestAnimationFrame(frame);
})();

</script>
</body>
